# recommended nextest profile for CI jobs (from
# https://nexte.st/book/configuration.html#profiles)
[profile.ci]
# Print out output for failing tests as soon as they fail, and also at the end
# of the run (for easy scrollability).
failure-output = "immediate-final"
# Do not cancel the test run on the first failure.
fail-fast = false

# Bound the regression if subscriber destruction re-enters a locked registry.
[[profile.ci.overrides]]
filter = 'test(subscriber_drop_during_interest_rebuild)'
slow-timeout = { period = "5s", terminate-after = 2 }

